name: check

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse all R scripts
        run: |
          Rscript -e 'f <- list.files("R", pattern = "\\.R$", full.names = TRUE);
                      for (x in f) { parse(x); cat("OK", x, "\n") }'
